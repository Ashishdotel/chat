# docker-compose.yml — Full Stack Deployment
# -------------------------------------------
# Runs the chatbot with Nginx as a reverse proxy.
#
# Architecture:
#   Internet → Nginx (port 80/443) → FastAPI (port 8000, internal)
#
# Why Nginx in front of FastAPI?
# - SSL termination (HTTPS)
# - Static file serving (faster than Python)
# - Rate limiting
# - Load balancing (if scaling to multiple workers)

version: "3.9"

services:

  # ── FastAPI Backend ────────────────────────────────────────
  chatbot:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: nepali-chatbot-api
    env_file:
      - ../deployment/.env.production
    volumes:
      # Persist database and vector store across container restarts
      - chatbot_data:/app/data
      - chatbot_eval:/app/evaluation/eval_results
    ports:
      - "8000:8000"      # Expose for direct access during development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Nginx Reverse Proxy ────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: nepali-chatbot-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - chatbot
    restart: unless-stopped

volumes:
  chatbot_data:
  chatbot_eval: