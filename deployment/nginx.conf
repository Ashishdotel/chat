# nginx.conf — Reverse Proxy Configuration
# -----------------------------------------
# Routes all traffic to the FastAPI backend.
# In production: add SSL certificate paths and redirect HTTP to HTTPS.

server {
    listen 80;
    server_name _;          # Replace with your domain in production

    # Maximum upload size (for PDF uploads)
    client_max_body_size 55M;

    # Proxy all requests to FastAPI
    location / {
        proxy_pass         http://chatbot:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;    # Long timeout for OpenAI API calls
    }
}